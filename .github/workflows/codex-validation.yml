name: Requested simulation validation
on:
  push:
    branches: [codex/validation-world]
permissions:
  contents: read
jobs:
  age:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8ef56f3a8f640b5d788f4d5b12065337810525d3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: /usr/bin/time -p npm test
      - uses: actions/checkout@v4
        with:
          ref: 8f7c69f614f3c01748c53192e43bd0c3548b9d4b
          path: reference
          persist-credentials: false
      - run: /usr/bin/time -p npm test
        working-directory: reference
      - run: /usr/bin/time -p npm run audit
      - run: node tools/audit.mjs 1 5
