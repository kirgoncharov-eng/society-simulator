name: Requested simulation validation
on:
  push:
    branches: [codex/validation-world]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: [9e4d60790f25c029240a1ca3eded8faa4d98a12c, 152f27d662f8bcc8ee036bbad5300d9faccb034c]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: /usr/bin/time -p npm test
      - run: /usr/bin/time -p npm run audit
