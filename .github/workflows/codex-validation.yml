name: Requested simulation validation
on:
  push:
    branches: [codex/validation-world]
permissions:
  contents: read
jobs:
  timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9665c9e469fbd76f06b1f0fc9ff4866bca2d52ea
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: /usr/bin/time -p npm test
      - run: git diff --exit-code -- dist
      - uses: actions/checkout@v4
        with:
          ref: 8f7c69f614f3c01748c53192e43bd0c3548b9d4b
          path: reference
          persist-credentials: false
      - run: /usr/bin/time -p npm test
        working-directory: reference
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9665c9e469fbd76f06b1f0fc9ff4866bca2d52ea
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run audit
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9665c9e469fbd76f06b1f0fc9ff4866bca2d52ea
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
          python3 tools/page_check.py
